services:
  db:
    image: postgis/postgis:16-3.4
    container_name: urban_infra_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-urban_infra}
      POSTGRES_USER: ${POSTGRES_USER:-urban_infra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-urban_infra_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-urban_infra} -d ${POSTGRES_DB:-urban_infra}"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: urban_infra_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-urban_infra}:${POSTGRES_PASSWORD:-urban_infra_dev_password}@db:5432/${POSTGRES_DB:-urban_infra}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-urban_infra}:${POSTGRES_PASSWORD:-urban_infra_dev_password}@db:5432/${POSTGRES_TEST_DB:-urban_infra_test}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_placeholder_change_in_production_9988776655}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "8000:8000"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.web
    container_name: urban_infra_web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"

volumes:
  pgdata:
